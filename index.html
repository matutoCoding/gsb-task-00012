<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装窑排器 · 窑位温度釉料管理</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">窑</span>
    <div>
      <h1>装窑排器</h1>
      <p>温度 · 釉料 · 位置 一起看，少烧一炉冤枉窑</p>
    </div>
  </div>
  <nav class="tabs">
    <button class="tab active" data-tab="load">装窑排器</button>
    <button class="tab" data-tab="history">烧窑记录</button>
  </nav>
  <div class="top-actions">
    <button id="btnSettings" class="btn ghost">阈值设置</button>
    <button id="btnAddKiln" class="btn">＋ 新窑炉</button>
  </div>
</header>

<!-- ========== 装窑页 ========== -->
<main id="tab-load" class="tab-panel active">
  <section class="summary-bar" id="summaryBar"></section>

  <div class="board">
    <!-- 左：待烧坯体 -->
    <aside class="waiting-panel">
      <div class="panel-head">
        <h2>待烧坯体 <span id="waitingCount" class="count-badge">0</span></h2>
        <button id="btnAddPiece" class="btn small">＋ 登记坯体</button>
      </div>
      <div class="legend">
        <span><i class="dot err"></i>红 = 冲突，进窑即坏</span>
        <span><i class="dot warn"></i>黄 = 有风险（近温/釉滴）</span>
        <span><i class="drop"></i>釉滴件 · <b>2×</b> 占双格</span>
      </div>
      <div id="waitingList" class="waiting-list"></div>
    </aside>

    <!-- 右：窑炉 -->
    <section class="kilns-panel">
      <div id="kilnStack" class="kiln-stack"></div>
    </section>
  </div>
</main>

<!-- ========== 记录页 ========== -->
<main id="tab-history" class="tab-panel">
  <div class="history-head">
    <h2>烧窑记录</h2>
    <div class="history-tools">
      <input type="search" id="historySearch" placeholder="搜窑号 / 主人 / 坯体…">
      <button id="btnExportHistory" class="btn ghost">导出全部 CSV</button>
    </div>
  </div>
  <div id="historySummary" class="history-summary"></div>
  <div id="historyList" class="history-list"></div>
</main>

<!-- ========== 坯体弹窗 ========== -->
<div class="modal-mask" id="pieceModal">
  <div class="modal">
    <h3 id="pieceModalTitle">登记坯体</h3>
    <div class="form-grid">
      <label>坯体名称<input id="pf_name" placeholder="如：青釉大罐"></label>
      <label>主人
        <select id="pf_owner"></select>
      </label>
      <label>要求温度 ℃<input id="pf_temp" type="number" min="600" max="1400" step="5" placeholder="如 1280"></label>
      <label>占位宽度
        <select id="pf_size">
          <option value="1">单格（普通件）</option>
          <option value="2">双格（大件，占连续两格）</option>
        </select>
      </label>
      <label class="check-line"><input type="checkbox" id="pf_drip"> 釉料会滴（必须放最底层）</label>
      <label class="check-line"><input type="checkbox" id="pf_lockedPiece"> 这件位置已定死，不参与移动</label>
      <label class="full">备注<input id="pf_note" placeholder="选填"></label>
    </div>
    <p class="form-tip">新主人可在「主人」里直接输入名字添加。</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn danger ghost" id="pf_delete" style="display:none">删除</button>
      <button class="btn primary" id="pf_save">保存</button>
    </div>
  </div>
</div>

<!-- ========== 窑炉弹窗 ========== -->
<div class="modal-mask" id="kilnModal">
  <div class="modal">
    <h3 id="kilnModalTitle">新建窑炉</h3>
    <div class="form-grid">
      <label>窑号 / 名称<input id="kf_name" placeholder="如：四号窑"></label>
      <label>层数<input id="kf_layers" type="number" min="1" max="12"></label>
      <label>每层格位数<input id="kf_cols" type="number" min="1" max="20"></label>
      <label>本炉柴火费（元，选填）<input id="kf_cost" type="number" min="0" step="0.5"></label>
    </div>
    <p class="form-tip">窑温范围决定哪些坯体能进这炉；格子数决定能不能摆下。</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn danger ghost" id="kf_delete" style="display:none">删窑（仅空窑）</button>
      <button class="btn primary" id="kf_save">保存</button>
    </div>
  </div>
</div>

<!-- ========== 阈值设置 ========== -->
<div class="modal-mask" id="settingsModal">
  <div class="modal">
    <h3>风险阈值设置</h3>
    <div class="form-grid">
      <label>同窑最大温差 ℃<input id="sf_kilnSpan" type="number" min="10" max="300" step="5"></label>
      <label>同层相邻预警温差 ℃<input id="sf_adjSpan" type="number" min="5" max="200" step="5"></label>
    </div>
    <p class="form-tip">温差超过「同窑」值 → 红冲突，不能同炉；同层相邻两件温差超过「预警」值 → 黄色风险。</p>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn danger ghost" id="sf_reset">清空全部数据</button>
      <button class="btn primary" id="sf_save">保存</button>
    </div>
  </div>
</div>

<!-- ========== 锁窑复评 ========== -->
<div class="modal-mask" id="recheckModal">
  <div class="modal wide">
    <h3>锁窑复评 · <span id="rc_kilnName"></span></h3>
    <p class="form-tip">炉子已锁住，加入 <b id="rc_pieceName"></b> 前必须把整窑风险重新过一遍：</p>
    <div id="rc_result" class="recheck-body"></div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="rc_confirm" disabled>我已知晓风险，确认加入</button>
    </div>
  </div>
</div>

<!-- ========== 出窑记录 ========== -->
<div class="modal-mask" id="firingModal">
  <div class="modal wide">
    <h3>出窑登记 · <span id="fm_kilnName"></span></h3>
    <p class="form-tip">逐件记下好坏。烧坏的写清坏在哪一层、什么毛病，以后装窑可翻。</p>
    <div class="form-grid">
      <label>开烧日期<input id="fm_start" type="date"></label>
      <label>出窑日期<input id="fm_end" type="date"></label>
    </div>
    <div id="fm_rows" class="firing-rows"></div>
    <div class="modal-actions">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="fm_save">记入档案并清空此窑</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
